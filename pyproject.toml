[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forestfix"
version = "0.2.0"
description = "A verifiable multi-agent patch evaluation and product console"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.scripts]
forestfix = "forestfix.cli:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forestfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
